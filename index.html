<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ForkNote — Clarify as you read, verdict by point, turn AI answers into research notes that fit reality."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>ForkNote</title>
    <script>
      (function () {
        try {
          var key = "forknote-theme";
          var pref = localStorage.getItem(key);
          var theme =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        try {
          var loc = localStorage.getItem("forknote-locale");
          if (loc !== "en" && loc !== "zh") {
            loc = (navigator.language || "").toLowerCase().indexOf("zh") === 0
              ? "zh"
              : "en";
          }
          document.documentElement.lang = loc === "zh" ? "zh-CN" : "en";
        } catch (e) {
          /* keep html lang */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
