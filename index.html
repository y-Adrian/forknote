<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ForkNote — Clarify as you read, verdict by point, turn AI answers into research notes that fit reality."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>ForkNote</title>
    <script>
      (function () {
        try {
          var key = "forknote-theme";
          var pref = localStorage.getItem(key);
          var theme =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        try {
          var loc = localStorage.getItem("forknote-locale");
          if (loc !== "en" && loc !== "zh") {
            loc = (navigator.language || "").toLowerCase().indexOf("zh") === 0
              ? "zh"
              : "en";
          }
          document.documentElement.lang = loc === "zh" ? "zh-CN" : "en";
        } catch (e) {
          /* keep html lang */
        }
        try {
          var uiFont = localStorage.getItem("forknote-ui-font");
          var root = document.documentElement;
          if (!uiFont || uiFont === "default") {
            root.setAttribute("data-ui-font", "default");
          } else if (uiFont === "system") {
            root.setAttribute("data-ui-font", "system");
          } else {
            var family = uiFont.indexOf("family:") === 0
              ? uiFont.slice(7)
              : uiFont;
            family = String(family || "").trim();
            if (family) {
              root.setAttribute("data-ui-font", "custom");
              root.style.setProperty(
                "--fn-ui-font-family",
                '"' + family.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"',
              );
            } else {
              root.setAttribute("data-ui-font", "default");
            }
          }
        } catch (e) {
          document.documentElement.setAttribute("data-ui-font", "default");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
