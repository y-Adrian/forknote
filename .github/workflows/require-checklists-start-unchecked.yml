# Fail when a PR is opened/reopened with Test plan already checked.
# Authors must start from `- [ ]`, verify, then edit to `- [x]` (Issue #68).
#
# Review conversations are enforced automatically by「Require reviews resolved」
# (no markdown checkbox).
#
# On edited/synchronize/ready_for_review this check no-ops (success) so a failed
# "opened with pre-checks" can be cleared after the author unchecks and saves.
name: Require Checklists Start Unchecked

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
    branches: [leading]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-checklists-start-unchecked:
    name: Require checklists start unchecked
    runs-on: ubuntu-latest
    steps:
      - name: Fail if Test plan was pre-checked on open
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [ "${EVENT_ACTION}" != "opened" ] && [ "${EVENT_ACTION}" != "reopened" ]; then
            echo "OK: event is '${EVENT_ACTION}' — pre-check rule only enforced on opened/reopened."
            exit 0
          fi

          BODY=$(gh api "repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')

          if ! printf '%s' "$BODY" | grep -Eiq '^[[:space:]]*##[[:space:]]+Test[[:space:]]+[Pp]lan[[:space:]]*$'; then
            echo "Note: no ## Test plan section on open (other checks may still require it)."
            exit 0
          fi

          SECTION=$(printf '%s' "$BODY" | awk '
            /^[[:space:]]*##[[:space:]]+/ {
              if (in_section) exit
              if (tolower($0) ~ /^[[:space:]]*##[[:space:]]+test[[:space:]]+plan[[:space:]]*$/) {
                in_section = 1
                next
              }
            }
            in_section { print }
          ')

          CHECKED=$(printf '%s' "$SECTION" | grep -Eic '^[[:space:]]*([-*]|[[:digit:]]+[.)])[[:space:]]+\[[xX]\]' || true)
          if [ "${CHECKED}" -gt 0 ]; then
            cat <<EOF
          ::error::Test plan 在打开 PR 时已有 ${CHECKED} 项被预先勾选（- [x]）。

          预期：打开时全部为 - [ ]；完成验证后再编辑 PR 描述勾选。
          EOF
            exit 1
          fi

          echo "OK: Test plan has no pre-checked items on open."
