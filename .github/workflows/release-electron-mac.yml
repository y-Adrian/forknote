# Build macOS Electron installers and attach them to a GitHub Release.
#
# Triggers:
#   - Push a version tag: git tag v0.1.0 && git push origin v0.1.0
#   - Manual run: Actions → “Release Electron Mac” → Run workflow
#
# Signing / notarization (optional):
#   When all of MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_ID,
#   APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are set as repository secrets,
#   the job signs + notarizes. Otherwise it builds unsigned (Gatekeeper may warn)
#   and prints an explicit notice — secret-dependent steps stay blocked.
#
# Artifacts: DMG + ZIP (arm64 + x64).
name: Release Electron Mac

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to create/update (e.g. v0.1.0). Leave empty to only upload workflow artifacts."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-electron-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS packages
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Tag '${TAG}' must look like v1.2.3"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Package version set to ${VERSION}"

      - name: Resolve signing mode
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_CERTIFICATE:-}" ] \
            && [ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ] \
            && [ -n "${APPLE_ID:-}" ] \
            && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] \
            && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization secrets present — will sign and notarize."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets incomplete; building UNSIGNED (Gatekeeper may warn). Configure MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID to enable."
          fi

      - name: Build DMG + ZIP (arm64 + x64)
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npm run build
          if [ "${SIGNING_MODE}" = "signed" ]; then
            export CSC_LINK="${MACOS_CERTIFICATE}"
            export CSC_KEY_PASSWORD="${MACOS_CERTIFICATE_PASSWORD}"
            unset CSC_IDENTITY_AUTO_DISCOVERY || true
            npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forknote-mac-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ForkNote ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            macOS builds from CI.

            - If repository signing secrets are configured, artifacts are signed and notarized.
            - Otherwise builds are **unsigned** — first open may be blocked by Gatekeeper (allow in **System Settings → Privacy & Security**, or `xattr -cr /path/to/ForkNote.app`).

            Prefer the **DMG** for install; **ZIP** is the same `.app` archived.
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap

      - name: Publish GitHub Release (manual tag input)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ForkNote ${{ inputs.tag }}
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          body: |
            macOS builds from CI.

            - If repository signing secrets are configured, artifacts are signed and notarized.
            - Otherwise builds are **unsigned** — first open may be blocked by Gatekeeper (allow in **System Settings → Privacy & Security**, or `xattr -cr /path/to/ForkNote.app`).

            Prefer the **DMG** for install; **ZIP** is the same `.app` archived.
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
