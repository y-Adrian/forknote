# Typecheck + production build for PRs (and pushes) to `leading`.
# Required status check name matches job name: "Build".
name: CI

on:
  pull_request:
    branches: [leading]
  push:
    branches: [leading]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Agent regression tests
        run: npm run test:agent
